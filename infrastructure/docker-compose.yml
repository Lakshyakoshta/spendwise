services:

  postgres:
    image: postgres:17
    container_name: spendwise-postgres

    environment:
      POSTGRES_DB: spendwise
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: spendwise_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendwise -d spendwise"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ../backend

    container_name: spendwise-backend

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: spendwise
      DB_USERNAME: spendwise
      DB_PASSWORD: spendwise_dev_password
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

    container_name: spendwise-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend


volumes:
  postgres_data: